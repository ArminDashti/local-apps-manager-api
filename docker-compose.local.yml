# Local Docker: Postgres + API (Air) + WebUI (Vite), with bind-mount hot reload.
services:
  postgres:
    image: postgres:16-alpine
    container_name: local-apps-postgres
    environment:
      POSTGRES_USER: localapps
      POSTGRES_PASSWORD: localapps
      POSTGRES_DB: localapps
    ports:
      - "5455:5432"
    volumes:
      - local_apps_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localapps -d localapps"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - default

  api:
    build:
      context: .
      dockerfile: dockerfile.dev
    image: local-apps-manager-api-dev:latest
    pull_policy: build
    container_name: local-apps-manager-api
    working_dir: /app
    environment:
      HTTP_ADDR: ":8195"
      DATABASE_URL: postgres://localapps:localapps@postgres:5432/localapps?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      DEFAULT_USERNAME: ${DEFAULT_USERNAME:-armin}
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:-dopadopa123}
      CORS_ORIGINS: http://localhost:5195,http://127.0.0.1:5195
      GITHUB_ROOT: /github
      DOCKER_STATE_PATH: /cursor-plugins/skills/run-apps-on-local-docker/.run-local-docker-pairs-state.json
      DOCKER_RUNNER_SCRIPT: /cursor-plugins/skills/run-apps-on-local-docker/scripts/Run-LocalDockerAppPairs.ps1
      HOST_IP: host.docker.internal
    ports:
      - "8195:8195"
    volumes:
      - .:/app
      - local_apps_gomod:/go/pkg/mod
      - local_apps_gotmp:/app/tmp
      - C:/Users/armin/GitHub:/github:ro
      - C:/Users/armin/.cursor/plugins/local/devops-by-armin:/cursor-plugins:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8195/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped
    networks:
      - default

  webui:
    build:
      context: ../local-apps-manager-webui
      dockerfile: dockerfile.dev
    image: local-apps-manager-webui-dev:latest
    pull_policy: build
    container_name: local-apps-manager-webui
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_PROXY_TARGET: http://api:8195
    ports:
      - "5195:5195"
    volumes:
      - ../local-apps-manager-webui:/app
      - local_apps_webui_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default

networks:
  default:
    name: t3-net
    external: true

volumes:
  local_apps_pgdata:
  local_apps_gomod:
  local_apps_gotmp:
  local_apps_webui_node_modules:
