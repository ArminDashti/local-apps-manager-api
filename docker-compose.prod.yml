# Production-like stack: Postgres + API + WebUI (Nginx).
# WebUI is the only published service; Nginx proxies /api and /health to the API.
#
#   docker network create t3-net   # if missing
#   docker compose -f docker-compose.prod.yml up --build -d
#
# Open: http://127.0.0.1:5195/apps

name: local-app-manager

services:
  postgres:
    image: postgres:16-alpine
    container_name: local-app-manager-postgres
    environment:
      POSTGRES_USER: localapps
      POSTGRES_PASSWORD: localapps
      POSTGRES_DB: localapps
    volumes:
      - local_app_manager_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localapps -d localapps"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - default

  api:
    build:
      context: .
      dockerfile: dockerfile
    image: pc-armin/local-app-manager-api:latest
    pull_policy: build
    container_name: local-app-manager-api
    environment:
      HTTP_ADDR: ":8195"
      DATABASE_URL: postgres://localapps:localapps@postgres:5432/localapps?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      DEFAULT_USERNAME: ${DEFAULT_USERNAME:-armin}
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:-dopadopa123}
      CORS_ORIGINS: http://127.0.0.1:5195,http://localhost:5195
      GITHUB_ROOT: /github
      DOCKER_STATE_PATH: /cursor-plugins/skills/run-apps-on-local-docker/.run-local-docker-pairs-state.json
      DOCKER_RUNNER_SCRIPT: /cursor-plugins/skills/run-apps-on-local-docker/scripts/Run-LocalDockerAppPairs.ps1
      NATIVE_RUNNER_SCRIPT: /cursor-plugins/skills/run-all-apps-locally/scripts/Run-ListedApps.ps1
      NATIVE_STATE_PATH: /cursor-plugins/skills/run-all-apps-locally/.run-listed-apps-state.json
      NATIVE_APPS_CONFIG: /cursor-plugins/skills/run-all-apps-locally/apps.yaml
      HOST_IP: host.docker.internal
    expose:
      - "8195"
    volumes:
      - C:/Users/armin/GitHub:/github:ro
      - C:/Users/armin/.cursor/plugins/local/devops-by-armin:/cursor-plugins:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8195/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    networks:
      - default

  webui:
    build:
      context: ../local-apps-manager-webui
      dockerfile: Dockerfile
    image: pc-armin/local-app-manager-webui:latest
    pull_policy: build
    container_name: local-app-manager-webui
    environment:
      API_HOST: local-app-manager-api
      API_PORT: "8195"
    ports:
      - "5195:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default

networks:
  default:
    name: t3-net
    external: true

volumes:
  local_app_manager_pgdata:
